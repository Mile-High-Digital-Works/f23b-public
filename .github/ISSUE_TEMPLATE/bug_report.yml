name: Bug report
description: Report a problem with the F-23B.
title: "[Bug] "
body:
  - type: input
    id: build
    attributes:
      label: Release
      description: Use the name or date shown on the GitHub release page.
      placeholder: v1.4 (October 6, 2026)
  - type: input
    id: dcs-version
    attributes:
      label: DCS version
      placeholder: 2.9.31.29434
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include the mission, payload, and steps if you know them.
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or log excerpt (optional)
      description: Include relevant dcs.log lines or installer output. Remove personal paths and account details before posting.
